<!doctype html>
<!--
  house-captions: studio house component (captions / karaoke)

  Word-timed captions in the house style: chunks of up to 3 words (or 1.2 s), broken at punctuation; the word
  being spoken lights in the accent, spoken words stay ink, upcoming words wait dimmed. Each chunk rises in
  over 4 frames (expo.out) and cuts out when the next chunk starts.

  Variables:
    - words (string): JSON array [{"text","start","end"}] in seconds FROM THE MOUNT START
      (take them from work/rough.words.json and subtract the mount's data-start).
    - y (number, default 68): caption centre as % of the frame height (keep it under the chin line).
    - size (number, default 5.4): font size in cqw (5.4 = 58 px on 1080 wide).
    - accent / ink (color): highlight and text colours; default the house tokens.
    - plate (boolean, default true): soft dark plate behind each chunk for busy footage.

  Mount: <div id="caps" data-composition-id="house-captions" data-composition-src="compositions/components/house-captions/house-captions.html"
          data-start="0" data-duration="<edit length>" data-track-index="9" data-track-kind="captions"
          data-variable-values='{"words":"[...]"}' style="position:absolute;inset:0"></div>
-->
<html
  lang="en"
  data-composition-id="house-captions"
  data-composition-duration="60"
  data-composition-variables='[
    { "id": "words", "type": "string", "role": "content", "label": "Words (JSON)", "default": "[{\"text\":\"Captions\",\"start\":0.2,\"end\":0.6},{\"text\":\"land\",\"start\":0.6,\"end\":0.9},{\"text\":\"on\",\"start\":0.9,\"end\":1.0},{\"text\":\"the\",\"start\":1.0,\"end\":1.1},{\"text\":\"word.\",\"start\":1.1,\"end\":1.6}]" },
    { "id": "y", "type": "number", "role": "style", "label": "Centre y (%)", "default": 68, "min": 10, "max": 90 },
    { "id": "size", "type": "number", "role": "style", "label": "Size (cqw)", "default": 5.4, "min": 2, "max": 12 },
    { "id": "accent", "type": "color", "role": "style", "label": "Accent", "default": "" },
    { "id": "ink", "type": "color", "role": "style", "label": "Ink", "default": "" },
    { "id": "plate", "type": "boolean", "role": "style", "label": "Plate", "default": true }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>House captions</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="house-captions" data-duration="60" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none; }
          .hc-clip { position: absolute; inset: 0; }
          .hc-chunk {
            position: absolute; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-wrap: wrap; justify-content: center; gap: 0 1.4cqw;
            max-width: 84cqw; padding: 0.9cqh 2.6cqw; border-radius: 2.4cqw;
            font-family: var(--h-font-text, Inter, system-ui, sans-serif); font-weight: 700;
            line-height: 1.12; letter-spacing: -0.02em; text-align: center; opacity: 0;
          }
          .hc-chunk.hc-plate { background: rgba(10, 12, 14, 0.55); }
          .hc-w { display: inline-block; }
        </style>
        <div id="house-captions-clip" class="hc-clip clip" data-start="0" data-duration="60" data-track-index="0"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var clip = root.querySelector(".hc-clip");
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var words = [];
            try { words = JSON.parse(v.words || "[]"); } catch (e) { words = []; }
            var y = Number.isFinite(Number(v.y)) ? Number(v.y) : 68;
            var size = Number.isFinite(Number(v.size)) ? Number(v.size) : 5.4;
            var css = getComputedStyle(document.documentElement);
            var accent = v.accent || css.getPropertyValue("--h-accent").trim() || "#C5A759";
            var ink = v.ink || css.getPropertyValue("--h-ink").trim() || "#F5F3EE";
            var plate = !(v.plate === false || v.plate === "false");
            var F = 1 / 30;

            // Chunk: up to 3 words or 1.2 s, and a break after sentence punctuation or a pause > 0.35 s.
            var chunks = [], cur = [];
            words.forEach(function (w, i) {
              cur.push(w);
              var next = words[i + 1];
              var span = w.end - cur[0].start;
              if (!next || cur.length >= 3 || span >= 1.2 || /[.!?,;:]$/.test(w.text) || next.start - w.end > 0.35) { chunks.push(cur); cur = []; }
            });

            var tl = gsap.timeline({ paused: true });
            chunks.forEach(function (c, k) {
              var el = document.createElement("div");
              el.className = "hc-chunk" + (plate ? " hc-plate" : "");
              el.style.top = y + "cqh";
              el.style.fontSize = size + "cqw";
              el.style.color = ink;
              var spans = c.map(function (w) {
                var s = document.createElement("span");
                s.className = "hc-w";
                s.textContent = w.text;
                s.style.opacity = "0.45";
                el.appendChild(s);
                return s;
              });
              clip.appendChild(el);
              var t0 = Math.max(0, c[0].start - 2 * F);
              var t1 = chunks[k + 1] ? Math.max(t0 + 4 * F, chunks[k + 1][0].start - 2 * F) : c[c.length - 1].end + 0.4;
              tl.fromTo(el, { opacity: 0, y: "1.2cqh" }, { opacity: 1, y: 0, duration: 4 * F, ease: "expo.out" }, t0);
              c.forEach(function (w, j) {
                tl.set(spans[j], { opacity: 1, color: accent }, Math.max(t0, w.start));
                if (j > 0) tl.set(spans[j - 1], { color: ink }, Math.max(t0, w.start));
              });
              tl.set(spans[spans.length - 1], { color: ink }, Math.max(t0, c[c.length - 1].end));
              tl.set(el, { opacity: 0 }, t1);
            });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["house-captions"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
